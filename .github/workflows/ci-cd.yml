name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      testdb:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gridlock
          POSTGRES_PASSWORD: gridlock
          POSTGRES_DB: gridlock_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gridlock"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://gridlock:gridlock@localhost:5433/gridlock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # DB-backed tests silently skip when the DB is unreachable; fail instead so
      # CI never deploys with the PostGIS properties unexercised.
      - run: pytest -q -rs | tee pytest.log; test ${PIPESTATUS[0]} -eq 0 && ! grep -q "SKIPPED" pytest.log
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: url
        run: |
          if [ -n "${{ vars.SITE_ADDRESS }}" ]; then
            echo "url=https://${{ vars.SITE_ADDRESS }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://$HOST" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/id_deploy\n' "$HOST" > ~/.ssh/config

      - name: Build image
        run: docker build -f backend/Dockerfile -t "gridlock:$TAG" .

      - name: Upload image and stack
        run: |
          ssh prod 'mkdir -p ~/gridlock'
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/remote-deploy.sh prod:gridlock/
          docker save "gridlock:$TAG" | gzip | ssh prod 'gunzip | docker load'

      - name: Deploy
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          printf 'APP_TAG=%s\nPOSTGRES_PASSWORD=%s\nGEMINI_API_KEY=%s\nSITE_ADDRESS=%s\n' \
            "$TAG" "$POSTGRES_PASSWORD" "$GEMINI_API_KEY" "$SITE_ADDRESS" \
            | ssh prod 'umask 077 && cat > ~/gridlock/.env.new'
          ssh prod '~/gridlock/remote-deploy.sh'

      - name: Smoke test
        run: |
          url="${{ steps.url.outputs.url }}"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$url/api/health"
          curl -fsS "$url/" | grep -q '<div id="root">'
