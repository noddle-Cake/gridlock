name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      testdb:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gridlock
          POSTGRES_PASSWORD: gridlock
          POSTGRES_DB: gridlock_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U gridlock"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://gridlock:gridlock@localhost:5433/gridlock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # DB-backed tests silently skip when the DB is unreachable; fail instead so
      # CI never deploys with the PostGIS properties unexercised.
      - run: pytest -q -rs | tee pytest.log; test ${PIPESTATUS[0]} -eq 0 && ! grep -q "SKIPPED" pytest.log
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC login to AWS; no long-lived keys in GitHub
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      AWS_REGION: us-east-1
      SERVICE: gridlock
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Create container service (first deploy only)
        run: |
          if ! aws lightsail get-container-services --service-name "$SERVICE" >/dev/null 2>&1; then
            aws lightsail create-container-service --service-name "$SERVICE" --power micro --scale 1
          fi
          for i in $(seq 60); do
            state=$(aws lightsail get-container-services --service-name "$SERVICE" \
              --query 'containerServices[0].state' --output text)
            echo "service state: $state"
            [ "$state" = READY ] || [ "$state" = RUNNING ] && exit 0
            sleep 10
          done
          exit 1

      - name: Build and push image
        run: |
          docker build -f backend/Dockerfile -t "$SERVICE:${{ github.sha }}" .
          aws lightsail push-container-image --service-name "$SERVICE" --label app \
            --image "$SERVICE:${{ github.sha }}"

      - id: deploy
        name: Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          image=$(aws lightsail get-container-images --service-name "$SERVICE" \
            --query 'containerImages[0].image' --output text)   # newest first
          jq -n --arg image "$image" '{
            app: {
              image: $image,
              ports: {"8000": "HTTP"},
              environment: {
                DATABASE_URL: env.DATABASE_URL,
                GEMINI_API_KEY: env.GEMINI_API_KEY,
                GEOCODER: "nominatim"
              }
            }
          }' > containers.json
          version=$(aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --containers file://containers.json \
            --public-endpoint '{"containerName":"app","containerPort":8000,
              "healthCheck":{"path":"/api/health","successCodes":"200"}}' \
            --query 'containerService.nextDeployment.version' --output text)
          rm containers.json
          echo "deploying $image as version $version"

          for i in $(seq 90); do
            read -r cur next url < <(aws lightsail get-container-services --service-name "$SERVICE" \
              --query 'containerServices[0].[currentDeployment.version,nextDeployment.state,url]' \
              --output text)
            echo "current=$cur next=$next"
            if [ "$next" = FAILED ]; then
              echo "::error::Deployment $version failed its health check; previous version still live"
              exit 1
            fi
            if [ "$cur" = "$version" ] && [ "$next" = None ]; then
              echo "url=${url%/}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for deployment $version"
          exit 1

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"
          curl -fsS "${{ steps.deploy.outputs.url }}/" | grep -q '<div id="root">'
