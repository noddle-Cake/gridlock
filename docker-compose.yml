services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gridmerge
      POSTGRES_PASSWORD: gridmerge
      POSTGRES_DB: gridmerge
    ports:
      - "5432:5432"
    volumes:
      - gridmerge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridmerge"]
      interval: 2s
      retries: 30

  # Disposable test database for DB-backed property tests (no volume).
  testdb:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gridmerge
      POSTGRES_PASSWORD: gridmerge
      POSTGRES_DB: gridmerge_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  gridmerge-db:
