# Production stack on a single Lightsail instance. CI copies this directory to
# ~/gridlock on the server and writes ~/gridlock/.env (APP_TAG, POSTGRES_PASSWORD,
# GEMINI_API_KEY, SITE_ADDRESS) before each `docker compose up -d`.
# Server-side names (project, ~/gridlock dir, DB user/name, gridlock_pgdata volume)
# keep the pre-rename "gridlock" so the running stack and its data carry over.
name: gridlock

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridlock
      # Only applied when the volume is first initialised; changing it later
      # requires ALTER USER inside the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gridlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridlock"]
      interval: 5s
      retries: 30

  app:
    image: gridmerge:${APP_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gridlock:${POSTGRES_PASSWORD}@db:5432/gridlock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # gemini-2.5-flash is closed to new keys; the free tier allows 5 requests/min.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_RPM: ${GEMINI_RPM:-5}
      # Sign-in: both set = the app needs a session; either empty = open (app/core/auth.py).
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GEOCODER: nominatim
      # Demo-seed source links, served by the API mounted at /api.
      SAMPLE_BASE_URL: /api/samples
      # Caddy compresses (zstd/gzip); the app compressing first would force gzip.
      COMPRESS_RESPONSES: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      retries: 30

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # HTTP_PORT/HTTPS_PORT only matter for local runs where 80/443 are taken.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
